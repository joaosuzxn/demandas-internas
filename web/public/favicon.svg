<!-- Favicon (item 0049): o mesmo desenho do ícone da AppLogo, com as cores em hex — o favicon não lê as variáveis
     do CSS. #555de3 = silk-indigo, #007cdf = brand-500. Mudou a logo, muda aqui também. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#555de3"/>
      <stop offset="1" stop-color="#007cdf"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#logo)"/>
  <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.5 11h14M18.5 7l4 4-4 4"/>
    <path d="M23.5 21.5H18.5" stroke-opacity="0.75"/>
    <path d="M8 21.5l2.5 2.5 4.5-5"/>
  </g>
</svg>
