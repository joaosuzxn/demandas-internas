map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 20m;

    # DNS do Docker com TTL curto: api/web recriados ganham IP novo e o nginx acompanha.
    # Upstream em variável faz o nome ser resolvido a cada requisição (e o nginx sobe mesmo sem api/web).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:9000;
    set $web_upstream http://web:5173;

    # ADR 0001 — /api e /sanctum vão para o Laravel (php-fpm)
    location ~ ^/(api|sanctum)(/|$) {
        root /var/www/api/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/api/public;
        fastcgi_pass $api_upstream;
    }

    # ADR 0001 — todo o resto vai para o Vite (dev), inclusive o websocket do HMR
    location / {
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
