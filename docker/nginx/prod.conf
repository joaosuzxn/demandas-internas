server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;

    # ADR 0001 — mesma origem; api resolvido a cada requisição (DNS do Docker)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:9000;

    root /usr/share/nginx/html;

    location ~ ^/(api|sanctum)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/api/public;
        fastcgi_pass $api_upstream;
    }

    # Arquivos do build com hash no nome: cache longo
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: rota desconhecida cai no index.html (Vue Router resolve)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
